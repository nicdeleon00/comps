<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comps for Marketplace</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --sub: #6e6e73; --accent: #0071e3; --good: #0b7a35; --good-bg: #e3f6e9; --bad: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --sub: #98989d; --accent: #0a84ff; --good: #30d158; --good-bg: rgba(48,209,88,.16); --bad: #ff6961; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: min(520px, calc(100vw - 32px)); background: var(--card); border-radius: 20px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    header img { width: 44px; height: 44px; border-radius: 11px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
    p { margin: 10px 0; color: var(--sub); }
    ol { padding-left: 22px; color: var(--sub); }
    li { margin: 6px 0; }
    button, a.btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 16px/1 inherit; font-family: inherit; cursor: pointer; text-decoration: none; margin: 8px 8px 0 0; }
    button.secondary, a.secondary { background: rgba(120,120,128,.16); color: var(--fg); }
    .ok { color: var(--good); background: var(--good-bg); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .err { color: var(--bad); font-weight: 600; }
    code { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon128.png" alt="">
      <div><h1 id="title">Comps for Marketplace</h1><div id="version" style="color:var(--sub);font-size:14px"></div></div>
    </header>
    <div id="body"></div>
  </main>
  <script src="update.js"></script>
</body>
</html>
