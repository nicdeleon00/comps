<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comps for Marketplace</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --sub: #6e6e73; --fill: #f2f2f7; --sep: rgba(60,60,67,.16); --accent: #0071e3; --good: #0b7a35; --good-bg: #e3f6e9; --warn: #8a4b00; --warn-bg: #fff4e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --sub: #98989d; --fill: #2c2c2e; --sep: rgba(235,235,245,.14); --accent: #0a84ff; --good: #30d158; --good-bg: rgba(48,209,88,.16); --warn: #ffb340; --warn-bg: rgba(255,179,64,.14); } }
    * { box-sizing: border-box; }
    body { margin: 0; width: 370px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; }
    header img { width: 30px; height: 30px; border-radius: 8px; }
    h1 { font-size: 16px; margin: 0; }
    .sub { color: var(--sub); font-size: 12.5px; }
    main { padding: 6px 16px 14px; }
    h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--sub); margin: 14px 2px 7px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 0; border-radius: 99px; padding: 6px 11px; font: 600 13px/1.1 inherit; font-family: inherit; cursor: pointer; background: var(--fill); color: var(--fg); }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
    input[type=text], input[type=number], select { font: inherit; font-size: 13.5px; color: inherit; background: var(--fill); border: 0; border-radius: 9px; height: 34px; padding: 0 10px; min-width: 0; }
    .full { width: 100%; margin-top: 8px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .row > * { flex: 1; }
    .big { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 700 15.5px/1 inherit; font-family: inherit; cursor: pointer; margin-top: 10px; }
    .big.stop { background: #ff3b30; }
    .auto { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .auto input { width: 17px; height: 17px; accent-color: var(--accent); }
    .auto select { height: 30px; }
    .note { border-radius: 10px; padding: 8px 10px; font-size: 12.5px; margin-top: 10px; background: var(--fill); }
    .note.ok { background: var(--good-bg); color: var(--good); }
    .note.warn { background: var(--warn-bg); color: var(--warn); }
    .nums { display: flex; gap: 8px; margin-top: 12px; }
    .num { flex: 1; background: var(--fill); border-radius: 11px; padding: 8px 11px; }
    .num b { display: block; font-size: 19px; }
    .num span { font-size: 11.5px; color: var(--sub); }
    ul { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow: auto; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: .5px solid var(--sep); }
    li:first-child { border-top: 0; }
    li .m { flex: 1; min-width: 0; }
    li .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .s { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li a { flex: none; text-decoration: none; background: var(--good-bg); color: var(--good); font-weight: 700; font-size: 12.5px; padding: 6px 10px; border-radius: 99px; }
    .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 2px; border-top: .5px solid var(--sep); }
    footer { display: flex; gap: 8px; padding: 0 16px 14px; }
    footer a, footer button { flex: 1; text-align: center; color: var(--accent); font: 600 13px/1 inherit; font-family: inherit; text-decoration: none; padding: 10px 6px; border-radius: 10px; background: var(--fill); border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1>Comps for Marketplace</h1><div class="sub" id="version"></div></div>
  </header>
  <main>
    <div id="update"></div>
    <h2>Search Marketplace for</h2>
    <div class="chips" id="presets"></div>
    <input class="full" type="text" id="custom" placeholder="Also search for… (e.g. lugia, giratina)">
    <div class="row">
      <input type="number" min="0" id="minPrice" placeholder="$ min" aria-label="Lowest price">
      <input type="number" min="0" id="maxPrice" placeholder="$ max" aria-label="Highest price">
      <select id="days" aria-label="Listed"><option value="1">Last 24 h</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="">Any time</option></select>
    </div>
    <button class="big" id="scan">▶ Search now</button>
    <label class="auto"><input type="checkbox" id="monitor"> Check by itself every
      <select id="every" aria-label="How often"><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 h</option><option value="180">3 h</option></select></label>
    <div id="status"></div>
    <div class="nums">
      <div class="num"><b id="priced">0</b><span>cards priced</span></div>
      <div class="num"><b id="deals" style="color:var(--good)">0</b><span>deals found</span></div>
    </div>
    <h2>Best deals</h2>
    <ul id="list"></ul>
    <h2>Settings</h2>
    <label class="opt">Price tags on Marketplace <input type="checkbox" id="enabled"></label>
    <label class="opt">Share deals on Comps (anonymous) <input type="checkbox" id="share"></label>
  </main>
  <footer>
    <a id="site" href="#" target="_blank" rel="noopener">All deals on Comps ↗</a>
    <button id="updates">Check for updates</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
