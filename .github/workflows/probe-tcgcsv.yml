name: Probe TCGCSV groups

# One-off: what's in the promo groups the catalog import skips.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Products of the skipped promo groups
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'comps-catalog/1.0'})))
          for gid in (24584, 24529):
              prods = get(f'https://tcgcsv.com/tcgplayer/3/{gid}/products')['results']
              prices = get(f'https://tcgcsv.com/tcgplayer/3/{gid}/prices')['results']
              print(f'== {gid}: {len(prods)} products, {len(prices)} prices')
              for p in prods[:12]:
                  print('   ', p['productId'], p['name'], '|', {e['name']: e['value'][:30] for e in p.get('extendedData', [])})
          PY
