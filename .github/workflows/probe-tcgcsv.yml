name: Probe TCGCSV categories

# One-off: lists TCGplayer's Pokémon categories (English, Japanese, Chinese…) and what each holds.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Categories and a sample of each
        run: |
          curl -s -A 'comps-catalog/1.0' https://tcgcsv.com/tcgplayer/categories > cats.json
          python3 - <<'PY'
          import json, urllib.request, collections
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'comps-catalog/1.0'})))
          groups = get('https://tcgcsv.com/tcgplayer/85/groups')['results']
          print('== Japan groups', len(groups))
          picks = [g for g in groups if any(k in g['name'] for k in ('151', 'Terastal Festival', 'VSTAR Universe', 'Shiny Treasure', 'Base Set', 'Battle Partners'))][:6]
          for g in picks:
              prods = get(f"https://tcgcsv.com/tcgplayer/85/{g['groupId']}/products")['results']
              prices = get(f"https://tcgcsv.com/tcgplayer/85/{g['groupId']}/prices")['results']
              cards = [p for p in prods if any(e['name'] == 'Number' for e in p.get('extendedData', []))]
              print(f"== {g['groupId']} {g.get('abbreviation')} | {g['name']} | {(g.get('publishedOn') or '')[:10]} | products {len(prods)} cards {len(cards)} prices {len(prices)} subtypes {sorted({p['subTypeName'] for p in prices})}")
              for p in cards[:3] + cards[-2:]:
                  pr = [x for x in prices if x['productId'] == p['productId']]
                  print('     ', p['productId'], p['name'], '|', {e['name']: e['value'] for e in p.get('extendedData', []) if e['name'] in ('Number', 'Rarity')}, '|', [(x['subTypeName'], x['marketPrice']) for x in pr])
          # How big would the whole Japanese catalog be? Sample 40 groups.
          import random
          random.seed(1)
          sample = random.sample(groups, 40)
          n = sum(len([p for p in get(f"https://tcgcsv.com/tcgplayer/85/{g['groupId']}/products")['results'] if any(e['name'] == 'Number' for e in p.get('extendedData', []))]) for g in sample)
          print('== cards in 40 sampled groups', n, '-> estimate for all', int(n / 40 * len(groups)))
          PY
