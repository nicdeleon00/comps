name: Fetch docs

# Reads public documentation pages (as text) for building integrations.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Pages to read, separated by spaces"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read pages
        env:
          URLS: ${{ inputs.urls }}
        run: |
          for u in $URLS; do
            echo "=================== $u"
            curl -sL --max-time 30 -A "Mozilla/5.0 (compatible; comps-docs-reader)" "$u" -o page.html -w "HTTP %{http_code}, %{size_download} bytes\n" || true
            python3 - <<'PY'
          import html, re
          s = open('page.html', encoding='utf-8', errors='replace').read()
          s = re.sub(r'(?is)<(script|style|svg)[^>]*>.*?</\1>', ' ', s)
          s = re.sub(r'(?i)<br\s*/?>|</(p|div|li|h\d|tr|pre|code)>', '\n', s)
          s = html.unescape(re.sub(r'<[^>]+>', ' ', s))
          s = re.sub(r'[ \t]+', ' ', s)
          s = re.sub(r'\n\s*\n+', '\n', s)
          print(s[:30000])
          PY
          done
