name: iOS screenshots

# Builds the app for the simulator and takes screenshots of the main screens, using
# the app's screenshot mode (sample cards in memory). Run it by hand from Actions.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these shots (names separated by spaces); empty takes them all"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          xcodebuild -project ios/Comps.xcodeproj -scheme Comps -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            COMPS_DATA_URL="https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}/" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -60; tail -n 30 build.log; exit 1; }

      - name: Take screenshots
        env:
          ONLY: ${{ inputs.only }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          best = next((d for d in phones if d["name"] == "iPhone 16 Pro"), phones[-1])
          print(best["udid"])')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Comps.app
          mkdir -p shots
          shoot() {
            name=$1; shift
            if [ -n "$ONLY" ] && ! echo " $ONLY " | grep -q " $name "; then return; fi
            xcrun simctl terminate "$DEVICE" com.comps.scanner 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.comps.scanner -screenshots "$@"
            if [ -n "$ONLY" ]; then
              for t in 4 7 10 14; do sleep 3; xcrun simctl io "$DEVICE" screenshot "shots/$name-at-$t.png" >/dev/null 2>&1 || true; done
              sleep 16
            else
              sleep 30
            fi
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
            # When only some shots are taken, also record what the app is doing (to catch a hang).
            if [ -n "$ONLY" ]; then
              PID=$(pgrep -f "Comps.app/Comps" | head -1)
              if [ -n "$PID" ]; then sample "$PID" 2 -file "shots/$name-sample.txt" >/dev/null 2>&1 || true; else echo "not running" > "shots/$name-sample.txt"; fi
              xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "Comps"' 2>/dev/null | grep -iE "error|fault|crash|exception|present|assert" | tail -80 > "shots/$name-log.txt" || true
              for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i comps | head -2); do cp ~/Library/Logs/DiagnosticReports/"$f" "shots/$name-crash-$f" || true; done
            fi
          }
          shoot collection -tab collection
          shoot collection-grid -tab collection -grid
          shoot mastersets -tab masterSets
          shoot masterset -tab masterSets -set 23821
          shoot deals -tab deals
          shoot marketplace -tab deals -pane marketplace
          shoot search -tab search
          shoot history -tab collection -history
          shoot history-session -tab collection -history -session
          shoot signin -tab collection -settings -signin -focus
          shoot review -tab collection -review
          shoot search-jp -tab search -query "mew ex jp"
          shoot search-mixed -tab search -query "charizard ex 201"
          xcrun simctl ui "$DEVICE" appearance dark
          shoot collection-dark -tab collection
          shoot masterset-dark -tab masterSets -set 23821
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Publish to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name="comps-bot" -c user.email="comps-bot@users.noreply.github.com" commit -qm "App screenshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
