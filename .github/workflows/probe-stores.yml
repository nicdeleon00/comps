name: Probe store stock pages
# One-off: what Dollar General's and Academy's own pages answer from GitHub's servers.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: .github/probe
        run: |
          npm init -y >/dev/null && npm i playwright-core@1.48.2 >/dev/null 2>&1
          node stores.mjs
