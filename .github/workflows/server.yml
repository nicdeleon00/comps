name: Server & web

on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", "supabase/**", "package.json", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

  database:
    # Checks supabase/schema.sql (accounts) on a real Postgres with a stand-in for Supabase's auth.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema tests
        env:
          PGPASSWORD: postgres
        run: supabase/test/run.sh -h localhost -U postgres
