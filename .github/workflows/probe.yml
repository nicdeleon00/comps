name: Check live site

# Fetches the published website and data from outside, as a phone would.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          for path in / /sets /card/tcg:42382 /data/status.json /data/index.json /data/deals.json /data/cards/14.json /data/sets.json; do
            echo "$(curl -s -o /tmp/b -w '%{http_code} %{size_download}B %{time_total}s' --compressed "$SITE$path")  $path"
          done
          echo "--- status.json"
          curl -s "$SITE/data/status.json" | jq -c '{exportedAt, counts, providers}'
          echo "--- top deals"
          curl -s --compressed "$SITE/data/deals.json" | jq -r '.counts, (.items[0:8][] | [.kindLabel, .card.name, .card.set, (.price|tostring), (.value|tostring), (.score|tostring)] | @tsv)'
          echo "--- index.json gzip size"
          curl -s -H 'Accept-Encoding: gzip' -o /tmp/i.gz -w '%{size_download}\n' "$SITE/data/index.json"
          echo "--- card image"
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' https://tcgplayer-cdn.tcgplayer.com/product/42382_400w.jpg
