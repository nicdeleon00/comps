name: iOS app

# Builds an unsigned IPA on a Mac runner. Sideloadly / AltStore / SideStore
# re-sign it with your Apple ID when you install it.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac runner label (macos-15 is Apple silicon; macos-15-intel uses a separate, often shorter queue)"
        default: macos-15-intel
        type: string

permissions:
  contents: write

jobs:
  build:
    # GitHub's Apple-silicon Mac pool is often congested; the Intel pool builds the same IPA.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, Release)
        run: |
          set +e
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          xcodebuild \
            -project ios/Comps.xcodeproj \
            -scheme Comps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPS_DATA_URL="https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}/" \
            build > build.log 2>&1
          status=$?
          # Surface compiler errors as annotations, and print each with context.
          grep -E "^/.*: error: " build.log | sort -u | sed -E 's#^(/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#' | head -80
          echo "---- errors with context ----"
          grep -E -A4 "^/.*: error: " build.log | head -400 || true
          echo "---- tail ----"
          tail -n 15 build.log
          exit $status

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Comps.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Comps.ipa Payload
          ls -lh Comps.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Comps-ipa
          path: Comps.ipa
          retention-days: 30

      - name: AltStore / SideStore source
        run: |
          SIZE=$(stat -f%z Comps.ipa)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Build/Products/Release-iphoneos/Comps.app/Info.plist)
          BUILD="${GITHUB_RUN_NUMBER}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          cat > altstore-source.json <<JSON
          {
            "name": "Comps",
            "identifier": "${OWNER_LC}.comps.source",
            "apps": [{
              "name": "Comps",
              "bundleIdentifier": "com.comps.scanner",
              "developerName": "${GITHUB_REPOSITORY_OWNER}",
              "subtitle": "Pokémon card scanner and price tracker",
              "localizedDescription": "Scan Pokémon cards continuously, track your collection's value, and find undervalued cards and grading spreads.",
              "iconURL": "${RAW}/ios/Comps/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "tintColor": "#0071E3",
              "versions": [{
                "version": "${VERSION}",
                "buildVersion": "${BUILD}",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "downloadURL": "${BASE}/Comps.ipa",
                "size": ${SIZE},
                "minOSVersion": "17.0"
              }],
              "appPermissions": { "entitlements": [], "privacy": { "NSCameraUsageDescription": "Scan and identify cards.", "NSLocalNetworkUsageDescription": "Connect to your Comps server." } }
            }]
          }
          JSON
          cat altstore-source.json

      - name: Publish "ios-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest Comps.ipa altstore-source.json \
            --title "Comps for iOS (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Install with Sideloadly, AltStore or SideStore — they sign it with your Apple ID. To get updates automatically, add this source in AltStore/SideStore: https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/altstore-source.json" \
            --prerelease
