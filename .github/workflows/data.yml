name: Prices & website

# Refreshes Pokémon prices, finds deals and grading spreads, and publishes the
# website to GitHub Pages. Price history lives in the "data" release so it
# survives between runs. Optional secrets: PPT_API_KEY (free graded prices from
# PokemonPriceTracker, learned ~50 cards a day), PRICECHARTING_TOKEN (paid graded
# prices), EBAY_CLIENT_ID + EBAY_CLIENT_SECRET (live listing scanner).
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download the whole catalog even if it's fresh"
        type: boolean
        default: false
      backfill:
        description: "Past days of price history to import this run (from TCGCSV's archives)"
        type: number
        default: 20
  push:
    branches: [main]
    paths: ["server/**", "web/**", "extension/**", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATA_DIR: ${{ github.workspace }}/data
      PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
      PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore price history
        run: |
          mkdir -p data
          if gh release download data --pattern comps.db.gz --dir data 2>/dev/null; then
            gunzip -f data/comps.db.gz && ls -lh data
          else
            echo "No saved database yet — starting fresh."
          fi

      - name: Refresh prices
        env:
          HISTORY_BACKFILL: ${{ inputs.backfill || 20 }}
        run: |
          command -v 7z >/dev/null || sudo apt-get install -y -qq p7zip-full >/dev/null
          node --disable-warning=ExperimentalWarning server/src/cli.js refresh ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Save price history
        run: |
          gzip -kf data/comps.db
          ls -lh data/comps.db.gz
          gh release view data >/dev/null 2>&1 || gh release create data --prerelease --title "Price database" \
            --notes "SQLite database with your price history. Updated by the Prices & website workflow — don't delete it."
          gh release upload data data/comps.db.gz --clobber

      - name: Build website
        env:
          # Accounts (optional): repository variables from your Supabase project (Settings → API).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Fall back to supabase/public.json (both values are public by design).
          [ -n "$VITE_SUPABASE_URL" ] || VITE_SUPABASE_URL=$(node -p 'require("./supabase/public.json").url || ""')
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || VITE_SUPABASE_ANON_KEY=$(node -p 'require("./supabase/public.json").anonKey || ""')
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          echo "SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          npm --prefix web ci --no-audit --no-fund
          REPO="${GITHUB_REPOSITORY#*/}"
          VITE_STATIC=1 VITE_BASE="/${REPO}/" VITE_REPO="${GITHUB_REPOSITORY}" npm --prefix web run build

      - name: Package the Marketplace extension
        run: |
          # Downloaded from Deals → Marketplace; unzips to a folder for "Load unpacked".
          mkdir -p /tmp/pkg && cp -r extension /tmp/pkg/comps-marketplace
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/web/dist/comps-marketplace.zip" comps-marketplace)

      - name: Export data
        run: |
          node --disable-warning=ExperimentalWarning server/src/cli.js export web/dist/data && du -sh web/dist/data
          # Public settings the iPhone app reads (so accounts work without rebuilding the app).
          node -e 'require("fs").writeFileSync("web/dist/config.json", JSON.stringify({ supabaseUrl: process.env.SUPABASE_URL || null, supabaseAnonKey: process.env.SUPABASE_ANON_KEY || null }))'
          cat web/dist/config.json | head -c 80; echo

      - name: Publish to GitHub Pages
        run: |
          cd web/dist
          cp index.html 404.html
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="comps-bot" -c user.email="comps-bot@users.noreply.github.com" commit -qm "Site and prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Keep accounts awake
        # Free Supabase projects pause after a week without use; this run counts as use.
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json" -d '{}' -o /dev/null \
            && echo "Supabase is awake (accounts database is set up)" || echo "::warning::Couldn't reach Supabase (has supabase/schema.sql been run?)"
          # Sign-up settings, for a quick health check in the log.
          curl -fsS "${SUPABASE_URL%/}/auth/v1/settings" -H "apikey: ${SUPABASE_ANON_KEY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(`Sign-ups ${j.disable_signup?"OFF":"open"} · email confirmation ${j.mailer_autoconfirm?"off (instant sign-up)":"ON — turn off Confirm email in Supabase"}`)})' || true
          # Shared Facebook Marketplace deals need the market_listings table from schema.sql.
          curl -fsS "${SUPABASE_URL%/}/rest/v1/market_listings?select=id&limit=1" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -o /dev/null \
            && echo "Marketplace sharing is set up" || echo "::warning::Marketplace sharing is off: run supabase/schema.sql in the Supabase SQL Editor"

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without commits.
        run: |
          git fetch -q origin main
          last=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git checkout -q -B main origin/main
            git -c user.name="comps-bot" -c user.email="comps-bot@users.noreply.github.com" commit -q --allow-empty -m "Keep scheduled price refresh active"
            git push -q origin main
          fi
